<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - NutriAi</title>
  <link rel="stylesheet" href="signUp.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="decor-circle decor-1"></div>
  <div class="decor-circle decor-2"></div>

  <div class="login-container">
    <div class="login-card">
      
      <div class="card-header">
        <img src="New folder/logo2.png" alt="NutriAi Logo" class="form-logo">
        <h1>Create Account</h1>
        <p style="color: #666; margin-top: 5px;">Join thousands of health enthusiasts</p>
      </div>

      <div class="card-body">
        <form class="login-form">
          <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" required>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Create a password" required>
              <i class="fa-regular fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
          </div>

          <button type="submit" class="btn-primary">SIGN UP</button>
          
          <div class="form-options" style="justify-content: center; margin-top: 15px;">
            <label class="remember-me" style="font-size: 0.8rem;">
              <input type="checkbox" required> I agree to the <a href="#" style="color: var(--primary);">Terms & Conditions</a>
            </label>
          </div>
        </form>

        <div class="divider"><span>OR</span></div>

        <div class="social-login">
          <button class="btn-social google">
            <i class="fa-brands fa-google"></i> Sign up with Google
          </button>
          <button class="btn-social apple">
            <i class="fa-brands fa-apple"></i> Sign up with Apple
          </button>
          <button class="btn-social fb">
            <i class="fa-brands fa-facebook-f"></i> Sign up with Facebook
          </button>
        </div>
      </div>

      <div class="card-footer">
        <p>Already have an account? <a href="signUp.html">Sign In</a></p>
      </div>

    </div>
  </div>

  <script>
    function togglePassword(id, icon) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
    document.querySelector('.login-form').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevents page reload
    
    const btn = document.querySelector('.btn-primary');
    const originalText = btn.innerText;
    
    // 1. Show Loading State
    btn.innerText = "CREATING ACCOUNT...";
    btn.style.opacity = "0.7";
    btn.disabled = true;

    // 2. Simulate an API call
    setTimeout(() => {
        alert("Account created successfully! Welcome to NutriAi.");
        window.location.href = "signUp.html"; // Redirect to login after success
    }, 1500);
});
  </script>
</body>
</html>
