<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - NutriAi</title>
  <link rel="stylesheet" href="signUp.css" />
  <!-- Using Font Awesome for Icons (Google, Facebook, Apple, Eye) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Decorative Background Elements (The "Fruits") -->
  <div class="decor-circle decor-1"></div> <!-- Represents the kiwi -->
  <div class="decor-circle decor-2"></div> <!-- Represents the strawberry -->

  <!-- Main Container -->
  <div class="login-container">
    
    <!-- The White Card -->
    <div class="login-card">
      
      <!-- Header / Logo -->
      <div class="card-header">
        <!-- Replace with your actual logo path -->
        <img src="New folder/logo2.png" alt="NutriAi Logo" class="form-logo">
        <h1>Sign In</h1>
      </div>

      <!-- Notification Box (Like the reference) -->
<div class="info-box">
    <i class="fa-solid fa-mobile-screen-button"></i>
    <p>Using the NutriAi mobile app? Please sign in with the same account to sync your data.</p>
  </div>

  <div class="login-body">
    <form class="login-form">
      <div class="input-group">
        <label for="email">Email or Account Name</label>
        <input type="text" id="email" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <i class="fa-regular fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>
      </div>

      <div class="form-actions">
        <label class="checkbox-container">
          <input type="checkbox">
          <span class="checkmark"></span>
          Remember me
        </label>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit">SIGN IN</button>
        <a href="#" class="forgot-pass">Forgot password?</a>
      </div>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <div class="social-login">
      <button class="btn-social fb">
        <i class="fa-brands fa-facebook-f"></i> Sign in with Facebook
      </button>
      <button class="btn-social google">
        <i class="fa-brands fa-google"></i> Sign in with Google
      </button>
      <button class="btn-social apple">
        <i class="fa-brands fa-apple"></i> Sign in with Apple
      </button>
    </div>
  </div>

<div class="card-footer">
  <p>No account? <a href="register.html">Sign Up</a>, it's easy.</p>
</div>

</div>  
</div>

  <script>
    // Simple script to toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
