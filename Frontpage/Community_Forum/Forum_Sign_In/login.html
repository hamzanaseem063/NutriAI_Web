<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NutriAi Community</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="logo">Nutri<span>Ai</span></div>
        <h2>Welcome </h2>
        <p>Please login to join the community</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Enter Forum</button>
        </form>

        
<div class="login-footer">
    <a href="#">Forgot password?</a>
    <span>Don't have an account? <a href="signup.html">Sign up</a></span>
</div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
